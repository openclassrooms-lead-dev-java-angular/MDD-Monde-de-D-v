<div class="input">
  <mat-label>
    {{ label() }}
  </mat-label>

  <mat-form-field outline appearance="outline" class="full-width">
    <input
      matInput
      [type]="type()"
      [placeholder]="placeholder()"
      [value]="value"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />

    @if (loading()) {
      <mat-spinner matSuffix diameter="20" />
    }

    @for (error of errors(); track error) {
      <mat-error> {{ error }} </mat-error>
    }
  </mat-form-field>
</div>
