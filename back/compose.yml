name: mdd

services:

  mdd_mysql:
    image: 'mysql:8.4'
    container_name: mdd-mysql
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  mdd_minio:
    image: minio/minio
    container_name: mdd-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  mdd_mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mdd-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
  minio_data: